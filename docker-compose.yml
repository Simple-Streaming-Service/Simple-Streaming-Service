services:
    db:
        image: neo4j
        restart: always
        environment:
            NEO4J_AUTH: "${DB_USERNAME}/${DB_PASSWORD}"
        volumes:
            - ./data:/data/db
        network_mode: host
    mediamtx:
        image: bluenviron/mediamtx
        volumes:
            - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
            - ./server.key:/server.key:ro
            - ./server.crt:/server.crt:ro
        network_mode: host
    flask-video-app:
        depends_on:
            - db
        environment:
            MTX_API_HOST: ${MTX_API_HOST}
            MTX_API_HOST_PORT: ${MTX_API_HOST_PORT}
            MTX_LIVE_HOST: ${MTX_LIVE_HOST}
            MTX_LIVE_HOST_PORT: ${MTX_LIVE_HOST_PORT}
            DB_HOST: ${DB_HOST}
            DB_PORT: ${DB_PORT}
            SECRET_KEY: ${SECRET_KEY}
            DB_USERNAME: ${DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD}
            DB_NAME: ${DB_NAME}
        build: .
        command: ./boot.sh
        network_mode: host
    nginx:
        image: nginx:alpine
        depends_on:
            - flask-video-app
            - mediamtx
        volumes:
            - ./app/static:/www/static
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
            - ./server.key:/server.key:ro
            - ./server.crt:/server.crt:ro
        network_mode: host