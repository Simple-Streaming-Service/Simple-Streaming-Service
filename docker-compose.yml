services:
    db:
        image: neo4j
        restart: always
        environment:
            NEO4J_AUTH: "${DB_USERNAME}/${DB_PASSWORD}"

        volumes:
            - ./neo4j/config:/config
            - ./neo4j/data:/data
            - ./neo4j/plugins:/plugins
        network_mode: host
    mediamtx:
        image: bluenviron/mediamtx
        volumes:
            - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
            - ./server.key:/server.key:ro
            - ./server.crt:/server.crt:ro
        network_mode: host
    flask-video-app:
        depends_on:
            - db
        volumes:
            - ./archive/data:/archive
        environment:
            MTX_API_HOST: ${MTX_API_HOST}
            MTX_API_HOST_PORT: ${MTX_API_HOST_PORT}
            MTX_LIVE_HOST: ${MTX_LIVE_HOST}
            MTX_LIVE_HOST_PORT: ${MTX_LIVE_HOST_PORT}
            DB_HOST: ${DB_HOST}
            DB_PORT: ${DB_PORT}
            SECRET_KEY: ${SECRET_KEY}
            DB_USERNAME: ${DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD}
            DB_NAME: ${DB_NAME}
        build:
            context: .
            dockerfile: DockerfileFlask
        command: ./flask_boot.sh
        network_mode: host
    graphql-app:
        depends_on:
            - db
        environment:
            MTX_API_HOST: ${MTX_API_HOST}
            MTX_API_HOST_PORT: ${MTX_API_HOST_PORT}
            MTX_LIVE_HOST: ${MTX_LIVE_HOST}
            MTX_LIVE_HOST_PORT: ${MTX_LIVE_HOST_PORT}
            DB_HOST: ${DB_HOST}
            DB_PORT: ${DB_PORT}
            SECRET_KEY: ${SECRET_KEY}
            DB_USERNAME: ${DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD}
            DB_NAME: ${DB_NAME}
        build:
            context: .
            dockerfile: DockerfileGraphQL
        command: ./graphql_boot.sh
        network_mode: host
    down-detector-app:
        depends_on:
            - flask-video-app
            - graphql-app
            - mediamtx
        environment:
            MTX_API_HOST: ${MTX_API_HOST}
            MTX_API_HOST_PORT: ${MTX_API_HOST_PORT}
            MTX_LIVE_HOST: ${MTX_LIVE_HOST}
            MTX_LIVE_HOST_PORT: ${MTX_LIVE_HOST_PORT}
            DB_HOST: ${DB_HOST}
            DB_PORT: ${DB_PORT}
            SECRET_KEY: ${SECRET_KEY}
            DB_USERNAME: ${DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD}
            DB_NAME: ${DB_NAME}
            TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
        build:
            context: .
            dockerfile: DockerfileDownDetector
        network_mode: host
    nginx:
        image: nginx:alpine
        depends_on:
            - flask-video-app
            - graphql-app
            - mediamtx
        volumes:
            - ./app/static:/www/static
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
            - ./server.key:/server.key:ro
            - ./server.crt:/server.crt:ro
        network_mode: host